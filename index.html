<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
  <title>Colors List</title>
</head>
<body>
  <div class="container">
    <header class="my-4">
      <h1>Mi lista de Colores</h1>
      <div class="mb-3">
        <button id="load-api" class="btn btn-primary mr-2">Cargar desde API</button>
        <button id="load-storage" class="btn btn-success mr-2">Cargar desde Storage</button>
        <button id="clear-list" class="btn btn-danger">Borrar lista</button>
      </div>
    </header>
    <main id="list-items"></main>
  </div>

  <!-- Optional JavaScript -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
